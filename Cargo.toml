[package]
name = "devcat"
version = "0.1.6"
authors = ["Lucian BLETAN <neuraluc@gmail.com>"]
edition = "2024"
description = "A micro-version control system for your AI development loop."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/devcat"

homepage = "https://github.com/gni/devcat"
repository = "https://github.com/gni/devcat"

categories = ["command-line-utilities", "development-tools"]
keywords = ["llm", "code", "ollama", "oss", "ai"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
globset = "0.4.20"
humantime = "2.4.0"
ignore = "0.4.33"
log = "0.4.34"
notify = "8.2.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.21"
toml = "0.9.12"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
